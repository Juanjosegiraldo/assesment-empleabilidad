openapi: 3.1.0

info:
  title: Riwi Messaging API
  version: 0.1.0
  description: |
    Internal messaging platform for Riwi Co. S.A.S.

    ## Authentication

    Two tokens, with different jobs.

    The **access token** is a short lived JWT sent as `Authorization: Bearer <token>`.
    It cannot be revoked once issued, so it expires in 15 minutes.

    The **refresh token** is an opaque random string kept in an `httpOnly` cookie scoped
    to `/auth`. It rotates on every use: presenting one consumes it and returns a new one.
    Presenting a token that was already consumed is treated as theft and revokes every
    session of that account.

    ## Permissions

    Authorisation is enforced by PostgreSQL, not by this API. Every request opens a
    transaction pinned to the authenticated user and row level security filters each
    statement. The practical consequences show up in the responses:

    - A channel the caller does not belong to is **invisible**, not forbidden. Reading its
      history returns an empty list rather than 403, because answering 403 would confirm
      that the channel exists.
    - Writing to such a channel does return **403**, since the attempt itself has to be
      refused.
    - The copilot can only retrieve messages the caller could have read directly.

    ## Pagination

    Keyset, never `OFFSET`. A page returns `nextCursor`; pass it back as `cursor` to get
    the next one. A `null` cursor means the end. Cursors are opaque.

servers:
  - url: http://localhost:4000
    description: Local development

tags:
  - name: Authentication
  - name: Channels
  - name: Messages
  - name: Search
  - name: Copilot
  - name: Realtime
  - name: Operations

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    correlationId:
      name: x-correlation-id
      in: header
      required: false
      description: |
        Echoed back on the response and attached to every log line for the request.
        Generated by the server when absent.
      schema: { type: string }

  schemas:
    Error:
      type: object
      description: The single error envelope used by every failing response, including 500.
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, correlationId]
          properties:
            code:
              type: string
              enum: [unauthorized, forbidden, not_found, invalid_input, conflict, internal_error]
            message: { type: string }
            correlationId:
              type: string
              description: Quote this when reporting a failure; it finds the exact request.

    User:
      type: object
      properties:
        id: { type: integer }
        email: { type: string, format: email }
        fullName: { type: string }
        jobTitle:
          type: string
          description: Injected into the copilot system prompt, server side, from the token.
        locale: { type: string, enum: [es, en] }

    Session:
      type: object
      description: |
        The refresh token is absent on purpose. It travels in an httpOnly cookie so
        script on the page cannot read it.
      properties:
        user: { $ref: "#/components/schemas/User" }
        accessToken: { type: string }
        expiresInSeconds: { type: integer, example: 900 }

    Conversation:
      type: object
      properties:
        id: { type: integer }
        slug: { type: string }
        name: { type: string }
        topic: { type: string, nullable: true }
        isPrivate: { type: boolean }
        lastMessageId: { type: integer, nullable: true }
        lastMessageBody: { type: string, nullable: true }
        lastMessageAt: { type: string, format: date-time, nullable: true }
        lastMessageAuthor: { type: string, nullable: true }
        unreadCount: { type: integer }

    Message:
      type: object
      properties:
        id: { type: integer }
        channelId: { type: integer }
        senderId: { type: integer }
        senderName: { type: string }
        senderJobTitle: { type: string }
        body: { type: string, maxLength: 4000 }
        createdAt: { type: string, format: date-time }
        editedAt: { type: string, format: date-time, nullable: true }
        readByActor: { type: boolean }

    MessagePage:
      type: object
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Message" }
        nextCursor:
          type: string
          nullable: true
          description: Opaque. Null means there are no older messages.

    SearchHit:
      allOf:
        - $ref: "#/components/schemas/Message"
        - type: object
          properties:
            channelName: { type: string }
            headline:
              type: string
              description: |
                The body with matches wrapped in `<mark>`. It contains text a user typed,
                so it must be rendered as text, never assigned to innerHTML.

    Citation:
      type: object
      properties:
        messageId: { type: integer }
        channelName: { type: string }
        authorName: { type: string }
        excerpt: { type: string }

    CopilotAnswer:
      type: object
      properties:
        answer: { type: string }
        citations:
          type: array
          description: |
            Only ids that were actually in the retrieved context. A citation the model
            invented is dropped rather than shown.
          items: { $ref: "#/components/schemas/Citation" }
        refusal:
          type: string
          nullable: true
          enum: [insufficient_context, no_permission, out_of_scope]
          description: |
            Non null when the copilot declined. `insufficient_context` with zero token
            usage means nothing was retrievable, so the model was never called.
        usage:
          type: object
          properties:
            promptTokens: { type: integer }
            completionTokens: { type: integer }
        promptVersion: { type: string, example: v1 }
        model: { type: string, example: openai/gpt-oss-20b }

  responses:
    Unauthorized:
      description: Missing, expired or forged access token.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: The database refused the operation for this actor.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: |
        Does not exist, or is not visible to this actor. The two are deliberately
        indistinguishable.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Invalid:
      description: The request body or query string did not validate.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

security:
  - bearerAuth: []

paths:
  /health:
    get:
      tags: [Operations]
      summary: Liveness and database reachability
      description: Actually queries the database. Used by the compose healthcheck.
      security: []
      responses:
        "200":
          description: The API and its database are up.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  database:
                    type: object
                    properties:
                      reachable: { type: boolean }
                      latencyMs: { type: number }
                  uptimeSeconds: { type: integer }

  /auth/login:
    post:
      tags: [Authentication]
      summary: Sign in
      description: |
        Answers identically for a wrong password and an unknown address, and verifies
        against a constant hash when the address does not exist so both paths take the
        same time. Different answers, or different timings, turn this into a staff
        directory.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        "200":
          description: Signed in. Sets the `rw_refresh` cookie.
          headers:
            Set-Cookie:
              schema: { type: string }
              description: "rw_refresh=...; HttpOnly; SameSite=Strict; Path=/auth"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/Invalid" }

  /auth/refresh:
    post:
      tags: [Authentication]
      summary: Rotate the session
      description: |
        Consumes the presented refresh token and issues a new pair. Presenting a token
        that was already consumed revokes every session of the account and answers 401.
      security: []
      responses:
        "200":
          description: Rotated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "401":
          description: Unknown, expired, or reused token. On reuse, all sessions are revoked.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /auth/logout:
    post:
      tags: [Authentication]
      summary: Revoke the current refresh token
      description: Idempotent, and silent about whether the token existed.
      security: []
      responses:
        "204": { description: Signed out. }

  /auth/me:
    get:
      tags: [Authentication]
      summary: The authenticated user
      responses:
        "200":
          description: The caller's profile.
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /channels:
    get:
      tags: [Channels]
      summary: The caller's conversations
      description: |
        Backed by the `rw_user_conversations` view, which is declared
        `security_invoker = true` so it runs under the caller's policies rather than the
        view owner's. Channels the caller does not belong to never appear.
      parameters:
        - $ref: "#/components/parameters/correlationId"
      responses:
        "200":
          description: One entry per channel, most recent first.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Conversation" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /channels/{channelId}/messages:
    parameters:
      - name: channelId
        in: path
        required: true
        schema: { type: integer }
    get:
      tags: [Messages]
      summary: Channel history, newest first
      description: |
        Returns an empty list for a channel the caller does not belong to. That is not a
        bug: the rows do not exist for this actor, and a 403 would confirm the channel is
        real.
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 30, minimum: 1, maximum: 100 }
        - name: cursor
          in: query
          description: From `nextCursor` of the previous page.
          schema: { type: string }
      responses:
        "200":
          description: A page of messages.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessagePage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/Invalid" }
    post:
      tags: [Messages]
      summary: Send a message
      description: |
        Goes through `rw_send_message`, which checks membership and records the author's
        own read receipt in the same transaction. The sender is taken from the token; the
        body has no sender field.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string, minLength: 1, maxLength: 4000 }
      responses:
        "201":
          description: Sent.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { $ref: "#/components/schemas/Message" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Invalid" }

  /channels/{channelId}/read:
    post:
      tags: [Messages]
      summary: Mark the channel read up to a message
      parameters:
        - name: channelId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [upToMessageId]
              properties:
                upToMessageId: { type: integer }
      responses:
        "200":
          description: Number of read receipts created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  receiptsCreated: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /channels/{channelId}/stream:
    get:
      tags: [Realtime]
      summary: Server sent events for new messages
      description: |
        Membership is verified before any byte is written, so an unauthorised subscriber
        is never attached.

        The database announces an insert carrying only ids. This endpoint then re-reads
        the message as the subscriber's own actor, so row level security decides again at
        delivery time and a user removed from the channel a second ago receives nothing.

        A `: keepalive` comment is sent every 25 seconds.

        Note the browser cannot use `EventSource` here: it has no way to send an
        `Authorization` header, and putting the token in the query string would write it
        into access logs and browser history. The client reads the stream with `fetch`.
      parameters:
        - name: channelId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: An open `text/event-stream`.
          content:
            text/event-stream:
              schema: { type: string }
              example: |
                : connected

                event: message
                data: {"id":142,"channelId":22,"body":"...","senderName":"Laura Betancur"}
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /messages/{messageId}:
    parameters:
      - name: messageId
        in: path
        required: true
        schema: { type: integer }
    patch:
      tags: [Messages]
      summary: Edit your own message
      description: |
        Archives the previous body into `rw_message_revisions` in the same transaction as
        the update, so an edit either records its original or does not happen.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string, minLength: 1, maxLength: 4000 }
      responses:
        "200":
          description: Edited.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { $ref: "#/components/schemas/Message" }
        "403":
          description: Not the author.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Messages]
      summary: Delete your own message
      description: |
        A soft delete. The row stays with `deleted_at` set; the application holds no
        DELETE privilege on the table at all.
      responses:
        "204": { description: Deleted. }
        "403":
          description: Not the author.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }

  /search:
    get:
      tags: [Search]
      summary: Full text search across the caller's channels
      description: |
        Accent and case insensitive, using a custom `rw_spanish` text search
        configuration, so "paginacion" and "paginación" find each other. No membership
        filter appears in the query and none is needed: searching cannot reach further
        than reading.
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 2 }
        - name: limit
          in: query
          schema: { type: integer, default: 30, maximum: 100 }
        - name: cursor
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Matching messages with the term highlighted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/SearchHit" }
                  nextCursor: { type: string, nullable: true }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/Invalid" }

  /copilot/ask:
    post:
      tags: [Copilot]
      summary: Ask the copilot
      description: |
        Embeds the question, retrieves the nearest passages **the caller is allowed to
        read**, and answers only from them, citing each claim.

        Retrieval is an ordinary SQL query, so the same row level security policies that
        govern reading a channel govern what the copilot can see. Two people asking the
        identical question get context built from different rows, with no application code
        deciding that.

        When nothing relevant is retrieved the language model is never called: the
        response carries `refusal: "insufficient_context"` and zero token usage.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [question]
              properties:
                question: { type: string, minLength: 5, maxLength: 500 }
      responses:
        "200":
          description: An answer, or a typed refusal.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CopilotAnswer" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/Invalid" }

  /copilot/usage:
    get:
      tags: [Copilot]
      summary: The caller's accumulated copilot consumption
      description: |
        Row level security restricts `rw_copilot_usage` to the caller's own rows, so this
        can only ever report one person's usage. The company wide report is an
        administrative query, run through the owner connection.
      responses:
        "200":
          description: Totals for the caller.
          content:
            application/json:
              schema:
                type: object
                properties:
                  call_count: { type: integer }
                  prompt_tokens: { type: integer }
                  completion_tokens: { type: integer }
                  total_tokens: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }
